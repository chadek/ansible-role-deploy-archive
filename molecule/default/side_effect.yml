---
# Deploy a second release on the "sync" host: the strategy only shows its worth
# across releases, and converge alone deploys once (the idempotence run skips the
# deployment tasks). Whatever the previous release left behind must be gone,
# while the kept state and the role-managed config file must survive.
- name: Side effect
  hosts: sync
  become: true

  pre_tasks:
    - name: Plant a leftover file the second release does not ship either
      ansible.builtin.file:
        path: "/opt/appname/orphan-from-second-release.txt"
        state: touch
        mode: "0644"
      changed_when: false

    - name: Record the config file identity before the second release
      ansible.builtin.stat:
        path: "/opt/appname/appname.conf"
      register: side_effect_conf_before

    - name: Keep the inode around for the verifier
      ansible.builtin.copy:
        content: "{{ side_effect_conf_before.stat.inode }}"
        dest: "/opt/appname/state/conf-inode-before"
        mode: "0644"
      changed_when: false

  vars:
    # Same source as converge.yml: a second deployment of the same archive is
    # enough, what matters is that the destination gets mirrored again.
    deploy_archive_user: {
      name: root,
      group: root,
    }
    deploy_archive_src: {
      url: "https://github.com/chadek/ansible-role-zammad/archive/refs/tags/1.0.0.tar.gz",
      checksum: "f02ef26932ad1b2b1e5f0f07dec8a4737c21189d555f7f576303696585dca09d",
      archive_name: "toto",
      permission: "0755"
    }
  tasks:
    - name: "Include deploy_archive"
      ansible.builtin.include_role:
        name: "ansible-role-deploy-archive"
