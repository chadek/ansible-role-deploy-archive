---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache and install cron
      ansible.builtin.apt:
        name: cron
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'
      changed_when: false

    # Simulate a previous release that shipped files the new archive does not
    # contain any more, next to runtime state that must survive the deployment.
    # Tagged like the deployment tasks themselves: the idempotence run skips both,
    # otherwise it would plant the leftover again after the sync removed it.
    - name: Create the directory holding the runtime state to keep
      ansible.builtin.file:
        path: "/opt/appname/state"
        state: directory
        mode: "0755"
      when: deploy_archive_strategy | default('overlay') == 'sync'
      changed_when: false
      tags:
        - molecule-idempotence-notest

    - name: Plant a leftover file and some runtime state
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - "/opt/appname/orphan-from-previous-release.txt"
        - "/opt/appname/state/keepme.txt"
      when: deploy_archive_strategy | default('overlay') == 'sync'
      changed_when: false
      tags:
        - molecule-idempotence-notest

  vars:
    deploy_archive_user: {
      name: root,
      group: root,
    }
    deploy_archive_src: {
      url: "https://github.com/chadek/ansible-role-zammad/archive/refs/tags/1.0.0.tar.gz",
      checksum: "f02ef26932ad1b2b1e5f0f07dec8a4737c21189d555f7f576303696585dca09d",
      archive_name: "toto",
      permission: "0755"
    }
  tasks:
    - name: "Include deploy_archive"
      ansible.builtin.include_role:
        name: "ansible-role-deploy-archive"
