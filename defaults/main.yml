---
# defaults file for deploy-archive
deploy_archive_app_name: "appname"

deploy_archive_dest: "/opt/{{ deploy_archive_app_name }}"

deploy_archive_get_url_headers: {}
deploy_archive_create_user: true
deploy_archive_appuser:
  {
    name: "{{ deploy_archive_app_name }}",
    group: "{{ deploy_archive_app_name }}",
    shell: "/bin/sh",
    home: "{{ deploy_archive_dest }}",
    comment: "User to run {{ deploy_archive_app_name }}",
  }

deploy_archive_src:
  {
    url: "test.net",
    archive_name: "{{ deploy_archive_app_name }}.tar.gz",
    checksum: "somechecksum",
  }

deploy_archive_systemd_restart: false

deploy_archive_conf:
  {
    path: "{{ deploy_archive_dest }}",
    filename: "{{ deploy_archive_app_name }}.conf",
    permission: "0644",
  }

# How the archive content is put in place:
#   overlay: extract on top of the existing tree. Files that disappeared from
#            the archive are left behind on the target (historic behaviour).
#   sync:    extract into a staging directory then rsync --delete it into
#            deploy_archive_dest, so the destination ends up matching the
#            archive exactly, except for the paths in deploy_archive_keep.
deploy_archive_strategy: "overlay"

# rsync exclude patterns protected from --delete when deploy_archive_strategy
# is "sync". Patterns follow rsync semantics and are relative to
# deploy_archive_dest: a leading "/" anchors the pattern to the root of the
# destination ("/backend/node_modules"), without it the pattern matches at any
# depth ("node_modules"). The uploaded archive and the config file managed by
# this role are protected automatically.
deploy_archive_keep: []

# Staging directory used by the "sync" strategy. It MUST live outside of
# deploy_archive_dest, and is removed once the sync succeeded.
deploy_archive_stage_dir: "{{ deploy_archive_dest_root }}.deploy-stage"
# Define this variable to activate define the content of a config file
# deploy_archive_conf_content: |
#   "some nice config file
#   multiline "example" with 'weird'
#   special problematic caracters"

# Define this variable to recursively set permissions on deployed files
# deploy_archive_dest_permissions:
#   { folder_permission: "0755", file_permission: "0644" }

# Define this variable to install some dependencies you might have
# deploy_archive_dependencies: [python3-testing, some_other_package]

# Define this variable to setup a crontab
# deploy_archive_cron:
#   {
#     day: "*",
#     hour: "20",
#     minute: "58",
#     job: "python3 {{ deploy_archive_dest }}/{{ deploy_archive_app_name}} --conf {{ deploy_archive_dest }}/{{ deploy_archive_conf.filename }}"
#   }

# Define this variable to setup a systemd file
# deploy_archive_systemd_content: |
#   "[Unit]
#   Description=Some systemd service
#   After=network.target

#   [Service]
#   Type=simple
#   ExecStart=/opt/some/app
#   Restart=always
#   User=user
#   Group=user

#   [Install]
#   WantedBy=multi-user.target"
